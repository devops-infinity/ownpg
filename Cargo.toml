[workspace]
members = ["crates/ownpg-core", "crates/ownpg"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Md. Sazzad Hossain Sharkar <sazzad@devops.bd>"]
repository = "https://github.com/devops-infinity/ownpg-releases"
homepage = "https://github.com/devops-infinity/ownpg-releases"
keywords = ["postgresql", "mcp", "database", "dba", "cli"]
categories = ["command-line-utilities", "database"]

[workspace.dependencies]
thiserror = "2.0.20"
pg_query = "6.2.0"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tempfile = "3.27.0"
secrecy = { version = "0.10.3", features = ["serde"] }
etcetera = "0.11.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "io-util", "io-std", "time", "sync", "macros", "signal"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "native-certs", "webpki-roots"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
webpki-roots = "1.0.9"
russh = { version = "0.63.3", default-features = false, features = ["flate2", "ring"] }
russh-config = "0.58.0"
tracing = "0.1.44"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
openssh = "0.11.6"
unicode-segmentation = "1.13.3"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "std"] }
rand = "0.10.2"
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["ed25519", "std", "rand_core"] }
rmcp = { version = "3.3.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server", "elicitation", "request-state", "schemars"] }
schemars = "1.2.2"
tokio-util = { version = "0.7.19", default-features = false }
pin-project-lite = "0.2.17"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "json", "std"] }
tracing-appender = "0.2.5"
rpassword = "7.5.4"
keyring = "4.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
overflow-checks = true

[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
overflow-checks = true

[profile.checked]
inherits = "dev"
overflow-checks = true
debug-assertions = true

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
allow-dirty = ["ci"]
installers = ["shell", "powershell", "homebrew", "npm"]
tap = "devops-infinity/homebrew-tap"
npm-scope = "@devops-infinity"
unix-archive = ".tar.gz"
cargo-auditable = true
cargo-cyclonedx = true
include = ["THIRD-PARTY.txt"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
