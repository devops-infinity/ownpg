name: PostgreSQL beta

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag of the official postgres image to test against
        required: false
        default: 19beta3

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  INSTA_UPDATE: "no"
  POSTGRES_BETA_TAG: ${{ github.event.inputs.image_tag || '19beta3' }}

jobs:
  live-beta:
    name: live (postgres:${{ github.event.inputs.image_tag || '19beta3' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      postgres:
        image: postgres:${{ github.event.inputs.image_tag || '19beta3' }}
        env:
          POSTGRES_USER: ownpg_ci
          POSTGRES_PASSWORD: ownpg_ci
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --locale=en_US.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownpg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RUSTUP_TOOLCHAIN: stable
      OWNPG_TEST_DSN: postgresql://ownpg_ci:ownpg_ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install the toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: install the newest PostgreSQL client programs
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          major="${POSTGRES_BETA_TAG%%[!0-9]*}"
          if sudo apt-get install -y --no-install-recommends "postgresql-client-${major}"; then
            echo "OWNPG_TEST_PG_BINDIR=/usr/lib/postgresql/${major}/bin" >> "$GITHUB_ENV"
          else
            echo "postgresql-client-${major} is not packaged yet; the host tool tests skip their real runs"
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: live-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: live-${{ runner.os }}-

      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af
        with:
          tool: cargo-nextest@0.9.144

      - name: cargo nextest against the beta server
        run: cargo nextest run --workspace --locked --no-tests=warn --color=never

      - name: doctor against the beta image
        env:
          OWNPG_HOST: 127.0.0.1
          OWNPG_PORT: "5432"
          OWNPG_USER: ownpg_ci
          OWNPG_DATABASE: postgres
          PGPASSWORD: ownpg_ci
        run: |
          cargo run --locked -p ownpg -- doctor --format json > doctor.json
          grep -q '"name": "connection"' doctor.json
          grep -q '"name": "server_version"' doctor.json
          grep -q '"features"' doctor.json
