name: Supply chain

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "about.toml"
      - ".github/workflows/supply-chain.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "about.toml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: supply-chain-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: supply-chain-${{ runner.os }}-

      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: cargo audit
        run: cargo audit --deny warnings

      - name: cargo deny check
        run: |
          set +e
          cargo deny check
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          failed=""
          if [ $((code & 1)) -ne 0 ]; then failed="${failed}advisories "; fi
          if [ $((code & 2)) -ne 0 ]; then failed="${failed}bans "; fi
          if [ $((code & 4)) -ne 0 ]; then failed="${failed}licenses "; fi
          if [ $((code & 8)) -ne 0 ]; then failed="${failed}sources "; fi
          if [ -z "$failed" ]; then failed="an exit code outside the documented bitset"; fi
          echo "::error::cargo deny exit $code: ${failed}"
          exit "$code"
